# On the default socket (monitor patch), WirePlumber links a capture stream
# whose screencast node is briefly missing to the webcam; make it wait instead.
# application.* is not visible here, hence the match on the webrtc stream name.
stream.rules = [
    {   matches = [ { node.name = "webrtc-consume-stream" } ]
        actions = {
            update-props = {
                node.dont-fallback = true
                # Without linger, dont-fallback destroys the stream instead.
                node.linger = true
            }
        }
    }
]
